
name: Docker Compose verification

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

      - name: Start containers and diagnose health failures
        run: |
          docker compose up --detach --wait || {
            echo "=== Container status ==="
            docker compose ps --all

            echo "=== Frontend health details ==="
            FRONTEND_ID="$(docker compose ps --all -q frontend)"

            if [ -n "$FRONTEND_ID" ]; then
              docker inspect --format '{{json .State}}' "$FRONTEND_ID"
              docker inspect --format '{{json .Config.Healthcheck}}' "$FRONTEND_ID"
            else
              echo "Frontend container was not found."
            fi

            echo "=== Frontend logs ==="
            docker compose logs --no-color frontend

            echo "=== Frontend port listeners and configuration ==="
            docker compose exec -T frontend sh -c '
              echo "--- Nginx site configuration ---"
              cat /etc/nginx/conf.d/default.conf
              echo "--- Main Nginx configuration ---"
              cat /etc/nginx/nginx.conf
              echo "--- Listening ports ---"
              if command -v netstat >/dev/null 2>&1; then
                netstat -lntp
              elif command -v ss >/dev/null 2>&1; then
                ss -lntp
              else
                cat /proc/net/tcp
                cat /proc/net/tcp6
              fi
            ' || true

            echo "=== All container logs ==="
            docker compose logs --no-color

            exit 1
          }

      - name: Run application smoke tests
        run: docker compose exec -T backend python scripts/compose_smoke.py

      - name: Print container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
