services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insightflow
      POSTGRES_USER: insightflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightflow_dev}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U insightflow"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://insightflow:${POSTGRES_PASSWORD:-insightflow_dev}@postgres:5432/insightflow
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      MAX_CSV_COLUMNS: ${MAX_CSV_COLUMNS:-500}
      MAX_CSV_ROWS: ${MAX_CSV_ROWS:-250000}
      MAX_ACTIVE_PROFILES_PER_USER: ${MAX_ACTIVE_PROFILES_PER_USER:-3}
      MAX_ACTIVE_EXPERIMENTS_PER_USER: ${MAX_ACTIVE_EXPERIMENTS_PER_USER:-2}
      PROFILE_JOB_TIME_LIMIT_SECONDS: ${PROFILE_JOB_TIME_LIMIT_SECONDS:-300}
      TRAINING_JOB_TIME_LIMIT_SECONDS: ${TRAINING_JOB_TIME_LIMIT_SECONDS:-1800}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [app_data:/data]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: ./backend
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=${LOG_LEVEL:-INFO}", "--concurrency=1"]
    environment:
      DATABASE_URL: postgresql+psycopg://insightflow:${POSTGRES_PASSWORD:-insightflow_dev}@postgres:5432/insightflow
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
      UPLOAD_DIR: /data/uploads
      MAX_CSV_ROWS: ${MAX_CSV_ROWS:-250000}
      MAX_ACTIVE_PROFILES_PER_USER: ${MAX_ACTIVE_PROFILES_PER_USER:-3}
      MAX_ACTIVE_EXPERIMENTS_PER_USER: ${MAX_ACTIVE_EXPERIMENTS_PER_USER:-2}
      PROFILE_JOB_TIME_LIMIT_SECONDS: ${PROFILE_JOB_TIME_LIMIT_SECONDS:-300}
      TRAINING_JOB_TIME_LIMIT_SECONDS: ${TRAINING_JOB_TIME_LIMIT_SECONDS:-1800}
    volumes: [app_data:/data]
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  app_data:

  
